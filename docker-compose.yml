services:
  products-db:
    build:
      context: ./src/db
    container_name: products-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wired
      POSTGRES_DB: postgres
    volumes:
      - products-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT stock FROM products LIMIT 1' >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - wired-brain-network

  products-api:
    build:
      context: ./src/products-api
    container_name: products-api
    ports:
      - "8081:80"
    depends_on:
      products-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wired-brain-network

  stock-api:
    build:
      context: ./src/stock-api
    container_name: stock-api
    environment:
      POSTGRES_CONNECTION_STRING: "host=products-db port=5432 user=postgres password=wired dbname=postgres sslmode=disable"
    ports:
      - "8082:8080"
    depends_on:
      products-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wired-brain-network

  web:
    build:
      context: ./src/web
    container_name: wired-brain-web
    environment:
      "ProductsApi:Url": "http://products-api/products"
      "StockApi:Url": "http://stock-api:8080/stock"
      ASPNETCORE_URLS: "http://+:80"
    ports:
      - "8080:80"
    depends_on:
      - products-api
      - stock-api
    restart: unless-stopped
    networks:
      - wired-brain-network
  prometheus:
    image: prom/prometheus:latest
    container_name: wired-brain-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - products-api
      - stock-api
      - web
    restart: unless-stopped
    networks:
      - wired-brain-network
volumes:
  products-data:
    name: wired-brain-products-data
  prometheus-data:
    name: wired-brain-prometheus-data
networks:
  wired-brain-network:
    name: wired-brain-network
    driver: bridge